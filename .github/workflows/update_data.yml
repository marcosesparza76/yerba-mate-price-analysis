name: Actualizacion Automatica Precios Yerba Mate

on:
  # Ejecución programada: Lunes y Jueves a las 12:00 UTC (09:00 AM Argentina)
  schedule:
    - cron: '0 12 * * 1,4'
  
  # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias y navegador Chromium
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib playwright requests
          python -m playwright install chromium --with-deps

      - name: 4. Ejecutar pipeline completo y enviar reporte
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python src/scraper_jumbo.py
          python src/etl_pipeline.py
          python src/integrar_fuentes.py
          python src/enviar_reporte.py

      - name: 5. Guardar nuevos datos y gráficos en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/ reports/
          git commit -m "chore: actualizacion automatica de precios y graficos" || echo "Sin cambios nuevos para guardar"
          git push
